[package]
name = "darts-cz"
version = "0.1.0"
description = "Pasivní inspektor WebSocket zpráv Autodarts"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "darts_cz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"
