[package]
name = "sipky"
version = "0.1.7"
description = "Šipky – lokální šipkařská aplikace nad Autodarts"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sipky_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"
