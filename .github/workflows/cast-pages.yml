name: Televizní obrazovka

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sestavit televizní obrazovku
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm build:cast
          cp dist-cast/receiver.html dist-cast/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-cast

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Zveřejnit na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
